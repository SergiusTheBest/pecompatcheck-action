name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --generate-notes --verify-tag

      - name: Update floating tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          major=$(echo "${{ github.ref_name }}" | grep -oE '^v[0-9]+')
          minor=$(echo "${{ github.ref_name }}" | grep -oE '^v[0-9]+\.[0-9]+')
          git tag -fa "$major" -m "Update $major to ${{ github.ref_name }}"
          git tag -fa "$minor" -m "Update $minor to ${{ github.ref_name }}"
          git push origin "$major" "$minor" --force
